<ion-header>
  <ion-toolbar>
    <ion-title>Registrar Usuário</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-label position="floating">Nome</ion-label>
    <ion-input [(ngModel)]="name"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Email</ion-label>
    <ion-input [(ngModel)]="email"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Senha</ion-label>
    <ion-input [(ngModel)]="password" type="password" (ionInput)="checkPassword()"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Confirmar Senha</ion-label>
    <ion-input [(ngModel)]="confirmPassword" type="password" (ionInput)="checkPassword()"></ion-input>
  </ion-item>

  <p [ngClass]="{'text-danger': !passwordValid, 'text-success': passwordValid}">
    {{ passwordMessage }}
  </p>

  <ion-item>
    <ion-label>Role</ion-label>
    <ion-select [(ngModel)]="role">
      <ion-select-option [value]="1">Admin</ion-select-option>
      <ion-select-option [value]="2">Gestor</ion-select-option>
      <ion-select-option [value]="3">User</ion-select-option>
    </ion-select>
  </ion-item>

  <ion-button expand="full" (click)="register()" [disabled]="loading || !passwordValid">
    {{ loading ? 'Registrando...' : 'Registrar Usuário' }}
  </ion-button>
</ion-content>
